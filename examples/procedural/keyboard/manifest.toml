# The arrow keys or WASD move a dot, and Space changes its color. The strip
# at the bottom shows the keys that are down. Click the wallpaper first, so
# that it gets the keyboard.

name = "Keyboard demo"
fps = 60

# One texel of state: where the dot is.
[[buffer]]
name = "pos"
shader = "pos.glsl"
size = [1, 1]
format = "rgba32f"
channels = ["pos", { keyboard = true }]

[image]
shader = "image.glsl"
channels = ["pos", { keyboard = true }]
